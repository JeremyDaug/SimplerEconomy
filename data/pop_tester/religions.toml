# Religion for the pop tester. Id 0 is empty and is not stored.
# Pop::update_desires copies a desire here onto each pop of this religion.
# Tier 2 is a luxury desire. The goods table shares one amount.
# cap is the share of that amount one good can fill. It defaults to 1.
# conversion is the ease of leaving and entering. 0 does not convert, 1 is open.

[[religions]]
id = 1
name = "hearth"
conversion = 1

[[religions.desires]]
id = 1
tier = 2
amount = 1
scalar = "all"

[[religions.desires.goods]]
good = "jewelry"
efficiency = 1

[[religions.desires.goods]]
good = "cabins"
efficiency = 2
use = true

[[religions.desires.goods]]
good = "time"
efficiency = 1
cap = 0.5

# Vessels. Buckets are owned and fill more. Pots are eaten and fill
# less. Each caps at three quarters, so neither good finishes the level
# alone.

[[religions.desires]]
id = 2
tier = 2
amount = 1
scalar = "all"

[[religions.desires.goods]]
good = "buckets"
efficiency = 2
use = true
cap = 0.75

[[religions.desires.goods]]
good = "pots"
efficiency = 1
cap = 0.75

# Same luxury desires as hearth. Jewelry fills a bit more. Cabins and
# time fill a bit less. Hearth time and shrine time both cap at half a
# level. Cabins stay owned. Buckets fill a bit less and pots a
# bit more. Half of hearth's conversion.

[[religions]]
id = 2
name = "shrine"
conversion = 0.5

[[religions.desires]]
id = 1
tier = 2
amount = 1
scalar = "all"

[[religions.desires.goods]]
good = "jewelry"
efficiency = 1.25

[[religions.desires.goods]]
good = "cabins"
efficiency = 1.75
use = true

[[religions.desires.goods]]
good = "time"
cap = 0.5
efficiency = 0.75

# Same vessel desire. Buckets still owned, pots still eaten. Each still
# caps at three quarters.

[[religions.desires]]
id = 2
tier = 2
amount = 1
scalar = "all"

[[religions.desires.goods]]
good = "buckets"
efficiency = 1.75
use = true
cap = 0.75

[[religions.desires.goods]]
good = "pots"
efficiency = 1.25
cap = 0.75
