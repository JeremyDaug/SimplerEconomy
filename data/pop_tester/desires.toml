# Platonic desires for the pop tester. Species and cultures derive a
# demographic desire from one of these. Scalar and decay are copied onto
# that demographic desire. An omitted scalar is all. Decay is the share of
# satisfaction lost each night. A goods table is the bucket. Efficiency is
# satisfaction from one unit. Type is consume or use.

