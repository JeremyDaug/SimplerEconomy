# Opening for examples/pop_tester. Goods, processes, crafts, and config
# come from data/world. Names here are those world names.
#
# A line target is that process's iterations for the first morning.
# The night's plan then rewrites every target from desires and stock.
# An omitted market amv or salability is 1.0.
#
# Bread made in the morning still feeds an open desire, so the extra loaf
# is sold the next day. Grain and water open above bread, so one unit pays
# for a loaf. The households are large enough that Time covers that wagon.

[[market]]
good = "time"

[[market]]
good = "grain"
amv = 4

[[market]]
good = "water"
amv = 4

[[market]]
good = "bread"

[[market]]
good = "gold_token"

[[pops]]
id = 1
craft = "farming"

[pops.household]
adult = 8
elder = 0
child = 0

[[pops.stock]]
good = "gold_token"
quantity = 6

[[pops.lines]]
process = "make grain"
target = 1

[[pops.desires]]
tier = 0
good = "bread"
amount = 1

[[pops]]
id = 2
craft = "watering"

[pops.household]
adult = 8
elder = 0
child = 0

[[pops.stock]]
good = "gold_token"
quantity = 6

[[pops.lines]]
process = "make water"
target = 1

[[pops.desires]]
tier = 0
good = "bread"
amount = 1

[[pops]]
id = 3
craft = "baking"

[pops.household]
