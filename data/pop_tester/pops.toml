# Pops for examples/pop_tester. Crafts, processes, and goods are world names.
# Desires come from species.toml, cultures.toml, strata.toml, and religions.toml.
# A line target is that process's iterations for the first morning.
# Later nights step those targets. They do not jump to a new quota.
#
# Output made in the morning still feeds an open desire, so the extra is
# sold the next day. Farming, watering, and baking use the subsistence
# variant of that craft. The other pops use the base subsistence craft.
# Their extra process is on the job: make wood, make beer, make
# wood_tools, make cabins, make gold, or make jewelry. Digging gold and
# making jewelry are separate pops. Gold is not a desire. The jeweler
# starts with 4 gold so the first morning can run. A human pop wants 50
# of its basic desire. Grazer food efficiencies are half of human, and
# its water efficiency is double.
# Farmer and water stay human, village, householder, hearth. The others
# use grazer, hamlet, cottager, crofter, tenant, or shrine. Hamlet
# assimilation and shrine conversion are half of the open pair. A
# different species does not take households from the other species.
# Opening targets are the line targets in this file. Later nights step
# from there.
# A missing count is 10 households. Each household is 2 adults, 2.5
# children, and 0.5 elders unless [pops.household] overrides those.

[[pops]]
id = 1
craft = "subsistence farming"
species = "human"
culture = "village"
stratum = "householder"
religion = "hearth"

[[pops.lines]]
process = "subsistence farm"
target = 0

[[pops.lines]]
process = "subsistence water"
target = 12.5

[[pops.lines]]
process = "subsistence forage"
target = 12.5

[[pops.lines]]
process = "make grain"
