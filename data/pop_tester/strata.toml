# Stratum for the pop tester. Id 0 is empty and is not stored.
# culture is the culture this stratum derives from.
# Tier 1 is a common desire. The goods table shares one amount.
# Wood is eaten. Wood tools are owned: consume sets them aside and decay
# returns them, minus the tool's own decay.

[[strata]]
id = 1
name = "householder"
culture = "village"

[[strata.desires]]
id = 1
tier = 1
amount = 1
scalar = "all"

[[strata.desires.goods]]
good = "wood"
efficiency = 1

[[strata.desires.goods]]
good = "wood_tools"
efficiency = 2
use = true

# Village's second stratum. Wood fills a bit less, tools a bit less.
# Tools stay owned.

[[strata]]
id = 2
name = "cottager"
culture = "village"

[[strata.desires]]
id = 1
tier = 1
amount = 1
scalar = "all"

[[strata.desires.goods]]
good = "wood"
efficiency = 0.75
cap = 0.75

[[strata.desires.goods]]
good = "wood_tools"
efficiency = 1.75
use = true
cap = 0.75

# Hamlet. Same goods as householder. Crofter fills both a bit more.
# Tenant keeps wood and fills tools less. Tools stay owned.

[[strata]]
id = 3
name = "crofter"
culture = "hamlet"

[[strata.desires]]
id = 1
tier = 1
amount = 1
scalar = "all"

[[strata.desires.goods]]
good = "wood"
efficiency = 1.25
cap = 0.75

[[strata.desires.goods]]
good = "wood_tools"
efficiency = 2.25
use = true
cap = 0.75

[[strata]]
id = 4
name = "tenant"
culture = "hamlet"

[[strata.desires]]
id = 1
tier = 1
amount = 1
scalar = "all"

[[strata.desires.goods]]
good = "wood"
efficiency = 1
cap = 0.75

[[strata.desires.goods]]
good = "wood_tools"
efficiency = 1.5
use = true
cap = 0.75
