# Developed opening for examples/pop_tester. Eight specialists, the goods
# the long run had actually reached, without the duplicate pops.
#
# The tester still reads data/pop_tester/. Swap by copying one folder
# over that one:
#   cp data/scenarios/developed/. data/pop_tester/
#   cp data/scenarios/subsistence/. data/pop_tester/
#
# Desires come from the species, culture, stratum, and religion files in
# this folder. Crafts, processes, and goods are world names. A line here
# is the job. The craft name does not add lines on its own.
# Each pop can feed itself. Stock is about two days of grain and water,
# plus one morning of whatever a specialty run spends. Sell targets still
# start empty and quarter-step. 380 households in all.

[[pops]]
id = 1
count = 60
craft = "subsistence farming"
species = "human"
culture = "village"
stratum = "householder"
religion = "hearth"

[[pops.stock]]
good = "grain"
quantity = 700

[[pops.stock]]
good = "water"
quantity = 600

[[pops.lines]]
process = "subsistence farm"
target = 8

[[pops.lines]]
process = "subsistence water"
target = 10

[[pops.lines]]
process = "subsistence forage"
target = 4

[[pops.lines]]
process = "subsistence cotton"
target = 4

[[pops.lines]]
process = "make grain"
target = 55

