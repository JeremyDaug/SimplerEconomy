# Opening board for the developed scenario. Good names are world names.
# An omitted salability is 1.0.
# Tender slots, in order. The first pays for an ordinary good.
#
# Cards sit a little above the cost of making the good, with time at 0.1
# and one complexity point on a specialty run. A made good clears the
# goods it spends. Wood tools and buckets spend one wood. Thread spends
# two cotton. Fabric and clothes spend two of the good below them and
# return two, so each of those cards is a point above the one it spends.
currencies = ["grain", "gold"]

[[market]]
good = "time"
amv = 0.1

[[market]]
good = "grain"
amv = 1

[[market]]
good = "water"
amv = 1

