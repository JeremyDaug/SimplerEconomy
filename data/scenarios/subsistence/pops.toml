# Subsistence opening. The tester reads data/pop_tester/. Copy this folder
# over that one to swap back from data/scenarios/developed/.
# Pops for examples/pop_tester. Crafts, processes, and goods are world names.
# Desires come from species.toml, cultures.toml, strata.toml, and religions.toml.
#
# One subsistence pop. Farm, water, forage, and cotton are the whole job. A later
# day can found a new pop when a good is bid and not offered. Grazer,
# hamlet, cottager, crofter, tenant, and shrine stay defined and unused.
# A missing count is 10 households. Each household is 2 adults, 2.5
# children, and 0.5 elders unless [pops.household] overrides those.

[[pops]]
id = 1
# Ten times the omitted default of 10 households.
count = 1000
craft = "subsistence"
species = "human"
culture = "village"
stratum = "householder"
religion = "hearth"

[[pops.lines]]
process = "subsistence farm"
target = 0

[[pops.lines]]
process = "subsistence water"
target = 0

[[pops.lines]]
process = "subsistence forage"
target = 0

[[pops.lines]]
process = "subsistence cotton"
target = 0
