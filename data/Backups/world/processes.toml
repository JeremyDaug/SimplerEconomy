# World data: processes (factuals).
# Human-editable. Live firm targets, stock, and prices are game state, not here.
#
# One recipe per world good: 1 Time (good 0) -> 15 of the output.
# Process id equals the output good id, except Time (good 0) which is
# process 28 so id 0 stays none.
#
# input type: destroyed | consumed | capital | factor  (default destroyed)
# optional = true to skip if the good is missing.
# outputs scale with bonuses unless fixed = true.

[[processes]]
id = 1
name = "make grain"
inputs = [{ good = 0, amount = 1.0 }]
outputs = [{ good = 1, amount = 15.0 }]

