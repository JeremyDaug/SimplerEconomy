# Firms for examples/firm_tester. Process names are loaded names.
# An omitted target runs as many iterations as the inputs allow.
# owners are pop ids. The market records them. One owner holds the firm.
# Several hold equal parts.
# stock is opening property. Each firm notes the pile that covers its first
# run. Labor decays at 1, so a larger pile would rot that night. The 100
# gold coins are the starter purse. They pay the owner and buy later inputs.

[[firms]]
id = 1
name = "Agribusiness"
market = 1
owners = [30]

[[firms.lines]]
process = "agribusiness"

[[firms.stock]]
good = "wood_tools"
amount = 1

[[firms.stock]]
good = "farmhand_labor"
amount = 1

[[firms.stock]]
good = "gold_coins"
amount = 100

