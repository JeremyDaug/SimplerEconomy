# Pops for examples/firm_tester. Species is a name from species.toml.
# Process names are world names. A target of 0 does not run. An omitted
# target runs as many iterations as the inputs allow. A job holds two lines.

# Twenty-eight pops, each with one craft. Bread, cabins, beer, huts, and the
# clothing chain are common goods. Water and coal are gathered for sale, and
# one pop farms grain and sells farmhand labor. That labor line may draw
# farming skill. Cotton, thread, and fabric are one pop each. One pop
# makes clothes and sells millhand labor. That labor line may draw
# clothworking skill.
# One pop mints Duckats. Storage adds wood, clay, pots, and buckets.
# Trinkets add iron, copper, tin, bronze, gold, and gold tokens. Tools add
# wood tools, iron tools, bronze tools, blades, and bronze mirrors. Cabins
# and huts already cover the rest of storage. One pop hauls cargo. One other
# pop sells only farmhand labor and may draw farming skill. One pop sells
# only millhand labor and may draw clothworking skill. One pop owns
# Agribusiness and has no craft. One pop owns the Clothes Mill and has no
# craft. One pop owns the Cotton Farm, one owns the Thread Mill, and one
# owns the Fabric Mill. None of those owners has a craft. A pop buys the
# goods its own craft does not make. Every pop but the five owners holds ten
# households. An owner is one household, so its wage stays small next to its
# firm.

[[pops]]
id = 1
species = "human"
culture = "village"
households = 10

[[pops.lines]]
process = "make bread"
target = 0

