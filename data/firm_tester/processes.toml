# Processes added by the firm tester. World processes stay in data/world.
#
# Farmhand labor takes 1 time and yields 0.5 farmhand labor. Farming skill
# is optional, 2 per run. Meeting it adds output 2.0 on top of the base 1,
# which triples the labor. The run also returns that skill: 2.2 is the 2
# fed plus a tenth, the same return the other skills use, and the flat
# 0.01 is on top of that.
#
# Agribusiness is industrial. One farmhand labor and one wood tool, used
# and returned, yield 400 grain. Make grain yields 40.
#
# Millhand labor takes 1 time and yields 0.5 millhand labor. Clothworking
# skill is optional, 2 per run, and triples the labor the same way farming
# does. The cloth firms are industrial. Make cotton spends 3 time for 6
# cotton. The Cotton Farm spends 1 farmhand labor and 1 wood tool, used and
# returned, and yields 60 cotton. Make thread spends 2 cotton and 1 time
# for 1 thread. The Thread Mill spends 2 cotton, 1 millhand labor, and 1
# wood tool and yields 10 thread. Make fabric spends 2 thread and 1 time
# for 2 fabric. The Fabric Mill spends 2 thread, 1 millhand labor, and 1
# wood tool and yields 20 fabric. The cottage chain spends 4 cotton and 5
# time to make 2 clothes. The Clothes Mill spends 4 cotton, 1 millhand
# labor, and 1 wood tool and yields 20 clothes.

[[processes]]
id = 47
name = "farmhand labor"
tags = ["labor"]
inputs = [
    { good = 0, amount = 1.0 },
    { good = 29, amount = 2.0, optional = true, optional_effects = [{ extra_output = { good = 29, amount = 2.2 } }, { output = 2.0 }] },
]
outputs = [
    { good = 47, amount = 0.5 },
    { good = 29, amount = 0.01, fixed = true },
]

