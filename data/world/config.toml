# World data: gameplay tunables.
# Human-editable. Missing keys keep the compiled defaults in src/game/config.rs.
# Load rejects values outside the bounds written on each GameConfig field.
# All invalid fields are reported together.
# Buffer sizes (pop HISTORY_MAX, market AMV_HISTORY_MAX) stay compile-time.
# This is not save data; changing tunables mid-game is not supported.
# Values below are the current plan defaults.

