# World data: goods (factuals).
# Human-editable. Starting prices, pops, and firms are initialization data, not here.
#
# Tags (optional): "fixed", "exposure", "untradeable", or { transport = 1.0 }
#
# Time is id 0 on purpose: it is foundational. Other goods start at 1.
# 0 still means none for pops, owners, and most other ids.
# Untradeable so pops cannot buy extra person-days; still transport 1.0.
# decay_rate is 1.0 on every good for now (full daily rot) so leftover
# stock cannot pile up while shop/save logic is still being tuned.

[[goods]]
id = 0
name = "time"
mass = 0.0
volume = 0.0
decay_rate = 1.0
tags = ["untradeable", { transport = 1.0 }]

