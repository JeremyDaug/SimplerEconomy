# World data: processes (factuals).
# Human-editable. Live firm targets, stock, and prices are game state, not here.
#
# Specialized recipes: process id equals the output good id, except Time
# (good 0) which is process 28 so id 0 stays none. Subsistence recipes are
# 29..=31 (household farm / water / forage). complexity below 1.0 is
# subsistence; these three use 0.25. Omitted complexity is 1.0, and the
# value must be finite and > 0.
#
# Raw extracts take Time only as required input; grain and wood may take
# optional boosters. Crafted recipes take Time plus at least one destroyed
# material. Subsistence is Time-only and weaker than the matching extract.
#
# Every process also takes one skill. The input is optional and is not
# required. The return, the flat output, and an output effect are written
# on the process. Some processes also take wood tools (good 9) as optional
# capital, one per run, with an output effect. Those amounts are test data.
# survival 28: subsistence and make time. farming 29: make grain.
# watering 30: make water. baking 31: make bread.
# goldsmithing 32: gold, gold token, jewelry.
# woodworking 33: wood, cabins, wood tools, buckets, charcoal.
# smithing 34: iron, iron tools, blades, iron token.
# metalworking 35: copper, tin, bronze, and their tools, mirror, and tokens.
# mining 36: coal. pottery 37: clay and pots. brewing 38: beer.
#
# input type: destroyed | consumed | capital | factor  (default destroyed)
# optional = true to skip if the good is missing.
# outputs scale with bonuses unless fixed = true.

[[processes]]
id = 1
name = "make grain"
inputs = [
    { good = 0, amount = 5.0 },
    { good = 2, amount = 0.5, optional = true, optional_effects = [{ output = 0.25 }] },
    { good = 9, amount = 1.0, type = "capital", optional = true, optional_effects = [{ output = 0.5 }] },
    { good = 29, amount = 1.0, optional = true, optional_effects = [{ extra_output = { good = 29, amount = 1.1 } }, { output = 0.5 }] },
]
outputs = [
    { good = 1, amount = 6.0 },
    { good = 29, amount = 0.01, fixed = true },
]

