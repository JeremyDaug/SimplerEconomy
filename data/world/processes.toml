# World data: processes (factuals).
# Human-editable. Live firm targets, stock, and prices are game state, not here.
#
# Specialized recipes: process id equals the output good id, except Time
# (good 0) which is process 28 so id 0 stays none. Subsistence recipes are
# 29..=31 (household farm / water / forage); tags = ["subsistence"] is
# complexity weight 0.25 (untagged is 1.0; weight must be > 0).
#
# Raw extracts take Time only as required input; grain and wood may take
# optional boosters. Crafted recipes take Time plus at least one destroyed
# material. Subsistence is Time-only and weaker than the matching extract.
#
# input type: destroyed | consumed | capital | factor  (default destroyed)
# optional = true to skip if the good is missing.
# outputs scale with bonuses unless fixed = true.

[[processes]]
id = 1
name = "make grain"
inputs = [
    { good = 0, amount = 0.5 },
    { good = 2, amount = 0.5, optional = true, optional_effects = [{ output = 0.25 }] },
    { good = 9, amount = 1.0, type = "capital", optional = true, optional_effects = [{ throughput = 0.25 }] },
]
outputs = [{ good = 1, amount = 6.0 }]

